[project]
name = "snapchat-cli"
version = "0.1.0"
description = "Download public snaps and metadata from snapchat.com (profiles, explore/search, places)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "curl_cffi>=0.7",
    "pydantic>=2.6",
    "aiofiles>=23.1",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=4"]

[project.scripts]
snapchat = "snapchat_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snapchat_cli"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
ignore = ["PYI034"]
extend-select = ["I", "COM812"]  # import sorting, trailing commas

[tool.ruff.lint.isort]
force-single-line = true  # one import per line

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits the live snapchat.com website (deselect with -m 'not network')"]
