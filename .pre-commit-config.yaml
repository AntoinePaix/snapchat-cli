# Install once with `pre-commit install`; run on everything with `pre-commit run --all-files`.
repos:
  - repo: local
    hooks:
      - id: forbid-credential-files
        name: forbid .env, HAR captures and token files
        language: fail
        entry: "credential file: never commit .env / .har / token.json files (they hold sessions and tokens)"
        files: '(^|/)(\.env(\..+)?|[^/]+\.har|token\.json)$'
        exclude: '(^|/)\.env\.example$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=1024]  # downloaded snaps, page captures
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6  # keep in sync with the ruff version installed in .venv
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
